# Which universe to trade. asset_class must be "us_equity" or "crypto" —
# the broker/data interfaces are asset-agnostic, this is the only switch.
asset_class: crypto
symbols:
  - BTC/USD
  - ETH/USD

strategy:
  name: momentum
  lookback_bars: 5
  entry_threshold_pct: 0.3   # % move over lookback window to trigger entry
  exit_threshold_pct: -0.1   # % move against position to trigger exit
  stop_loss_pct: -1.0        # % loss from entry price at which to force-exit, regardless of momentum
  timeframe: 1Min
  position_size_usd: 100

risk:
  # Cumulative realized loss (USD, across all symbols) at which the loop
  # halts all trading. Stays halted until the process is manually restarted
  # — no automatic reset at midnight or otherwise.
  max_daily_loss_usd: 20

loop:
  poll_interval_seconds: 30
